name: listening-post

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: timescale/timescaledb:2.29.1-pg18
    restart: unless-stopped
    # preload the extension explicitly: an existing data volume keeps the postgresql.conf it was first
    # created with (pre-timescale), and the image only writes shared_preload_libraries on a fresh initdb.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: listening_post
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432" # host-side only: just migrate, go run, psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listening_post"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One Go binary running the gateway, archiver, and history writer in one container.
  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/listening_post
      KAFKA_BROKERS: kafka:9092
      ARCHIVE_DIR: /archive
    volumes:
      - ./archive:/archive # bind mount so DuckDB and notebooks read it from the host
    ports:
      - "127.0.0.1:9091:9091" # admin port (health probes), host-side only
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init: # the topics must exist before we produce: auto-create is off
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: PathPrefix(`/v1`)
      traefik.http.routers.gateway.entrypoints: web
      traefik.http.services.gateway.loadbalancer.server.port: "8080"
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.gateway.loadbalancer.healthcheck.port: "9091"
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: 10s

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # single node: broker + controller in one process (KRaft, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT is for the compose network, EXTERNAL for the host; clients follow the advertised address
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are declared in kafka-init, not created by typo
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set in .env} # fixed so the persisted log dir matches across restarts
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094" # host-side only: local tools and gateway tests
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: declares topics and exits. Re-runs harmlessly on every `up` (--if-not-exists).
  # Names must match the constants in internal/wire/wire.go, internal/history/config.go, and
  # flink/.../ProcessorJob.java.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --partitions 3 --replication-factor 1 --topic "$$@"
        }
        # compacted: latest snapshot per aircraft. Small segments so compaction actually runs at this volume.
        compact="--config cleanup.policy=compact --config segment.ms=600000 --config min.cleanable.dirty.ratio=0.1"
        topic events.raw
        topic events.decoded
        topic aircraft.state $$compact
        topic aircraft.state_history
        # the backfill's shadow set: a second processor reads and writes these; only history writers read them
        # back. Transient, so a day's retention.
        replay="--config retention.ms=86400000"
        topic events.raw.replay $$replay
        topic events.decoded.replay $$replay
        topic aircraft.state.replay $$replay
        topic aircraft.state_history.replay $$replay

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: listening-post
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080" # host-side only; the UI has no auth
    depends_on:
      kafka:
        condition: service_healthy

  # The processor (flink/). Application mode: the jobmanager runs the one job baked into the image; the
  # taskmanager does the work. Checkpoints are retained on a shared volume, and the jobmanager resumes from
  # the newest complete one on start, so any restart recovers state without ZooKeeper/Kubernetes HA; see README.
  flink-jobmanager:
    build: &flink-build
      context: . # the repo root: the tests read internal/wire/testdata
      dockerfile: flink/Dockerfile
    image: &flink-image listening-post-processor # one image for all four Flink services
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Resume from the newest complete checkpoint, by _metadata mtime: each run gets a fresh job id and
        # directory, so the checkpoint number alone can't order them. Empty on first start. Every other run's
        # directory is dead (Flink doesn't reclaim a restored checkpoint), so prune them here, where no job runs.
        latest=$$(ls -t /opt/flink/checkpoints/*/chk-*/_metadata 2>/dev/null | head -n 1)
        keep=$$(dirname "$$(dirname "$$latest")")
        for d in /opt/flink/checkpoints/*/; do [ "$${d%/}" = "$$keep" ] || rm -rf "$$d"; done
        # --allowNonRestoredState: a job whose topology changed (a new/changed operator) must not crash-loop
        # on an old checkpoint; operators that no longer match are dropped, the rest restore as usual.
        exec /docker-entrypoint.sh standalone-job --job-classname listeningpost.ProcessorJob --allowNonRestoredState \
          $${latest:+--fromSavepoint "$$(dirname "$$latest")"}
    environment:
      KAFKA_BROKERS: kafka:9092
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager # the entrypoint turns this into jobmanager.rpc.address
      # managed memory is only used by the RocksDB backend; zero it so the heap backend gets that share
      FLINK_PROPERTIES: &flink-properties |
        taskmanager.numberOfTaskSlots: 2
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1024m
        taskmanager.memory.managed.size: 0m
        # short because output is only visible once the checkpoint commits its transactions; state is tiny
        execution.checkpointing.interval: 2s
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    ports:
      - "127.0.0.1:8083:8081" # Flink web UI, host-side only
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  flink-taskmanager:
    build: *flink-build
    image: *flink-image
    restart: unless-stopped
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      - flink-jobmanager

  # The backfill's shadow processor: the same job over the ".replay" topics, up only while `just backfill` runs.
  # Its jobmanager empties its checkpoint directory on start instead of resuming, so every backfill folds from
  # empty state by construction, whatever the previous run left behind.
  flink-jobmanager-replay:
    build: *flink-build
    image: *flink-image
    profiles: [backfill]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -rf /opt/flink/checkpoints/*
        exec /docker-entrypoint.sh standalone-job --job-classname listeningpost.ProcessorJob
    environment:
      KAFKA_BROKERS: kafka:9092
      TOPIC_SUFFIX: .replay
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager-replay
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-replay-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  flink-taskmanager-replay:
    build: *flink-build
    image: *flink-image
    profiles: [backfill]
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager-replay
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-replay-checkpoints:/opt/flink/checkpoints
    depends_on:
      - flink-jobmanager-replay

volumes:
  postgres:
  kafka:
  flink-checkpoints:
  flink-replay-checkpoints:
