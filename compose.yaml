name: listening-post

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
      # TLS — enable when deploying behind a real hostname:
      # - --entrypoints.websecure.address=:443
      # - --entrypoints.web.http.redirections.entrypoint.to=websecure
      # - --certificatesresolvers.le.acme.email=you@example.com
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - ./letsencrypt:/letsencrypt

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      STATIONS_FILE: /stations.json
    volumes:
      - ./stations.json:/stations.json:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: PathPrefix(`/v1`)
      traefik.http.routers.gateway.entrypoints: web
      # traefik.http.routers.gateway.tls.certresolver: le
      traefik.http.services.gateway.loadbalancer.server.port: "8080"
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.gateway.loadbalancer.healthcheck.port: "9091"
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: 10s
