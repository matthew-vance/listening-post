name: listening-post

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
      # TLS — enable when deploying behind a real hostname:
      # - --entrypoints.websecure.address=:443
      # - --entrypoints.web.http.redirections.entrypoint.to=websecure
      # - --certificatesresolvers.le.acme.email=you@example.com
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # - ./letsencrypt:/letsencrypt

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: listening_post
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432" # host-side only: just migrate, go run, psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listening_post"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/listening_post
      KAFKA_BROKERS: kafka:9092
      ARCHIVE_DIR: /archive
    volumes:
      - ./archive:/archive # bind mount so DuckDB and notebooks read it from the host
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init: # the topics must exist before we produce: auto-create is off
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: PathPrefix(`/v1`)
      traefik.http.routers.gateway.entrypoints: web
      # traefik.http.routers.gateway.tls.certresolver: le
      traefik.http.services.gateway.loadbalancer.server.port: "8080"
      traefik.http.services.gateway.loadbalancer.healthcheck.path: /readyz
      traefik.http.services.gateway.loadbalancer.healthcheck.port: "9091"
      traefik.http.services.gateway.loadbalancer.healthcheck.interval: 10s

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # single node: broker + controller in one process (KRaft, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT is for the compose network, EXTERNAL for the host; clients follow the advertised address
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are declared in kafka-init, not created by typo
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set in .env} # fixed so the persisted log dir matches across restarts
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094" # host-side only: local tools and gateway tests
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: declares topics and exits. Re-runs harmlessly on every `up` (--if-not-exists).
  # Names must match the constants in internal/wire/wire.go.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --partitions 3 --replication-factor 1 --topic "$$@"
        }
        # compacted: latest snapshot per aircraft. Small segments so compaction actually runs at this volume.
        compact="--config cleanup.policy=compact --config segment.ms=600000 --config min.cleanable.dirty.ratio=0.1"
        topic events.raw
        topic events.decoded
        # The processor checks at startup that this has >= events.decoded's partitions and is compacted.
        topic aircraft.state $$compact
        # Flink twins of the two above: the Flink job reads the same events.raw and writes here, so its output
        # can be compared with the Go processor's. Names must match the constants in flink/.../ProcessorJob.java.
        topic events.decoded.flink
        topic aircraft.state.flink $$compact

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: listening-post
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080" # host-side only; the UI has no auth
    depends_on:
      kafka:
        condition: service_healthy

  # The Go processor re-implemented as a Flink job (flink/), running side by side for comparison. Application
  # mode: the jobmanager runs the one job baked into the image; the taskmanager does the work. Checkpoints are
  # retained on a shared volume, and the jobmanager resumes from the newest complete one on start, so any
  # restart recovers state without ZooKeeper/Kubernetes HA; see README.
  flink-jobmanager:
    build: &flink-build
      context: . # the repo root: the tests read internal/wire/testdata
      dockerfile: flink/Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Resume from the newest complete checkpoint, by _metadata mtime: each run gets a fresh job id and
        # directory, so the checkpoint number alone can't order them. Empty on first start. Every other run's
        # directory is dead (Flink doesn't reclaim a restored checkpoint), so prune them here, where no job runs.
        latest=$$(ls -t /opt/flink/checkpoints/*/chk-*/_metadata 2>/dev/null | head -n 1)
        keep=$$(dirname "$$(dirname "$$latest")")
        for d in /opt/flink/checkpoints/*/; do [ "$${d%/}" = "$$keep" ] || rm -rf "$$d"; done
        exec /docker-entrypoint.sh standalone-job --job-classname listeningpost.ProcessorJob \
          $${latest:+--fromSavepoint "$$(dirname "$$latest")"}
    environment:
      KAFKA_BROKERS: kafka:9092
      # managed memory is only used by the RocksDB backend; zero it so the heap backend gets that share
      FLINK_PROPERTIES: &flink-properties |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1024m
        taskmanager.memory.managed.size: 0m
        execution.checkpointing.interval: 10s
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 5s
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    ports:
      - "127.0.0.1:8083:8081" # Flink web UI, host-side only
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  flink-taskmanager:
    build: *flink-build
    restart: unless-stopped
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      - flink-jobmanager

volumes:
  postgres:
  kafka:
  flink-checkpoints:
